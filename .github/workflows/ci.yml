# Checks every push and PR; on a version tag (v*) it also builds the 5 binaries and uploads them to R2.
# Release needs repo secrets CLOUDFLARE_API_TOKEN (R2 write) and CLOUDFLARE_ACCOUNT_ID.
# macOS binaries are not notarised: install.sh re-signs them ad hoc and clears quarantine.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install
        run: |
          cd cli && bun install --frozen-lockfile
          cd ../worker && bun install --frozen-lockfile
      - name: Typecheck
        run: |
          cd cli && bunx tsc --noEmit
          cd ../worker && bunx tsc --noEmit
      - name: Unit tests (swear filter)
        run: cd worker && bun test
      - name: Plugin CLI is in sync with cli/src
        run: |
          cd cli && bun run build:plugin
          git diff --exit-code -- ../plugin || (echo "plugin/ is stale: run 'bun run build:plugin' in cli/ and commit" && exit 1)
      - name: Smoke test the plugin CLI on fixtures
        run: |
          python3 fixtures/make_fixtures.py
          export SLOPMATCH_HOME="$RUNNER_TEMP/sm"
          node plugin/bin/slopmatch --version
          node plugin/bin/slopmatch extract --path fixtures/projects --days 3650 --quiet

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Tag matches CLI version
        run: |
          v=$(grep -o 'const VERSION = "[^"]*"' cli/src/cli.ts | cut -d'"' -f2)
          [ "v$v" = "$GITHUB_REF_NAME" ] || (echo "tag $GITHUB_REF_NAME != cli VERSION $v" && exit 1)
      - name: Install
        run: |
          cd cli && bun install --frozen-lockfile
          cd ../worker && bun install --frozen-lockfile
      - name: Build and upload binaries
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: cd cli && bun run release
